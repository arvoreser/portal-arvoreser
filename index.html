<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArvoreSer | Saúde Corporativa</title>

  <style>
    :root {
      --green-dark:#064001;
      --green:#187900;
      --green-soft:#F0F7ED;
      --text:#2A332C;
      --muted:#6C746E;
      --line:#E8ECE6;
      --white:#FFFFFF;
      --shadow:0 10px 28px rgba(22,49,22,.08);
      --shadow-hover:0 18px 40px rgba(23,250,3,.12), 0 10px 24px rgba(6,64,1,.09);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI", Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(238,247,233,.72), transparent 30%),
        linear-gradient(180deg,#FFFFFF 0%,#FEFFFD 70%,#F7FAF4 100%);
      overflow-x:hidden;
    }

    .page {
      position:relative;
      min-height:100vh;
      isolation:isolate;
    }

    .botanical {
      position:absolute;
      z-index:-1;
      pointer-events:none;
      opacity:.34;
    }

    .botanical.top-left {
      width:280px;
      top:-12px;
      left:-18px;
    }

    .botanical.top-right {
      width:300px;
      top:-8px;
      right:-16px;
      transform:scaleX(-1);
    }

    .botanical.bottom-left {
      width:310px;
      bottom:-20px;
      left:-28px;
      transform:scaleY(-1);
    }

    .botanical.bottom-right {
      width:320px;
      bottom:-10px;
      right:-30px;
      transform:scale(-1);
    }

    .shell {
      width:min(980px,calc(100% - 34px));
      margin:0 auto;
      padding:38px 0 30px;
    }

    .brand {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      margin-bottom:34px;
    }

    .logo {
      width:105px;
      height:105px;
      object-fit:contain;
      display:block;
    }

    .brand-copy {
      text-align:left;
    }

    .brand-name {
      margin:0;
      color:var(--green-dark);
      font-size:52px;
      line-height:1;
      font-weight:650;
      letter-spacing:-.04em;
    }

    .brand-subtitle {
      margin-top:7px;
      color:#616963;
      font-size:25px;
      font-weight:300;
      letter-spacing:-.02em;
    }

    .hero {
      text-align:center;
      margin-bottom:34px;
    }

    .hero h1 {
      margin:0;
      color:var(--green-dark);
      font-size:44px;
      line-height:1.15;
      font-weight:400;
      letter-spacing:-.035em;
    }

    .ornament {
      position:relative;
      width:270px;
      height:20px;
      margin:20px auto 12px;
    }

    .ornament::before,
    .ornament::after {
      content:"";
      position:absolute;
      top:50%;
      width:108px;
      height:1px;
      background:linear-gradient(90deg,transparent,#A9C7A3);
    }

    .ornament::before {
      left:0;
    }

    .ornament::after {
      right:0;
      transform:scaleX(-1);
    }

    .ornament svg {
      width:24px;
      height:24px;
      stroke:#74B46B;
      fill:none;
      stroke-width:1.5;
    }

    .hero p {
      margin:0;
      color:#626B64;
      font-size:18px;
      line-height:1.5;
      font-weight:300;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:20px;
      width:min(760px,100%);
      margin:0 auto;
    }

    .card {
      background:rgba(255,255,255,.97);
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
      min-height:242px;
      box-shadow:var(--shadow);
      transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease;
    }

    .card:hover {
      transform:translateY(-5px);
      border-color:#B7D8B1;
      box-shadow:var(--shadow-hover);
    }

    .card-head {
      display:flex;
      align-items:center;
      gap:14px;
      padding-bottom:15px;
      border-bottom:1px solid var(--line);
    }

    .company-icon {
      width:52px;
      height:52px;
      flex:0 0 52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--green-soft);
      color:var(--green-dark);
    }

    .company-icon svg {
      width:28px;
      height:28px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.65;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .company-name {
      color:var(--green-dark);
      font-size:22px;
      line-height:1.2;
      font-weight:600;
      letter-spacing:-.025em;
    }

    .details {
      display:grid;
      gap:15px;
      padding:17px 0 18px;
    }

    .detail {
      display:grid;
      grid-template-columns:32px 1fr;
      gap:10px;
      align-items:center;
    }

    .detail-icon {
      color:#4D8D42;
    }

    .detail-icon svg {
      width:23px;
      height:23px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.55;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .label {
      color:#737A75;
      font-size:12px;
      line-height:1.25;
      margin-bottom:2px;
      font-weight:400;
    }

    .value {
      color:var(--green-dark);
      font-size:15px;
      line-height:1.25;
      font-weight:600;
    }

    .open {
      width:100%;
      min-height:40px;
      border:1px solid var(--green);
      border-radius:999px;
      background:#fff;
      color:var(--green-dark);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      font-size:15px;
      font-weight:500;
      transition:background .2s,color .2s,transform .2s;
    }

    .open svg {
      width:17px;
      height:17px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .open:hover {
      background:var(--green-dark);
      color:#fff;
      transform:translateY(-1px);
    }

    .open.disabled {
      pointer-events:none;
      color:#8B918C;
      border-color:#D9DED7;
      background:#F8F9F7;
    }

    .quote {
      position:relative;
      width:min(760px,100%);
      margin:42px auto 0;
      padding:26px 20px 0;
      text-align:center;
    }

    .quote::before {
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:1px;
      background:linear-gradient(90deg,transparent,#B7CFB2 22%,#B7CFB2 78%,transparent);
    }

    .quote-leaf {
      position:absolute;
      top:-13px;
      left:50%;
      transform:translateX(-50%);
      width:28px;
      height:28px;
      padding:3px;
      background:#FEFFFD;
    }

    .quote-leaf svg {
      width:100%;
      height:100%;
      stroke:#76B76D;
      fill:none;
      stroke-width:1.5;
    }

    .quote p {
      margin:0;
      color:#626A64;
      font-size:15px;
      line-height:1.65;
      font-weight:300;
    }

    @media(max-width:760px) {
      .shell {
        padding-top:26px;
      }

      .brand {
        gap:12px;
      }

      .logo {
        width:82px;
        height:82px;
      }

      .brand-name {
        font-size:40px;
      }

      .brand-subtitle {
        font-size:20px;
      }

      .hero h1 {
        font-size:35px;
      }

      .grid {
        grid-template-columns:1fr;
        max-width:480px;
      }

      .card {
        min-height:auto;
      }

      .botanical {
        opacity:.22;
      }
    }

    @media(max-width:500px) {
      .shell {
        width:min(100% - 22px,980px);
      }

      .brand {
        flex-direction:column;
        text-align:center;
      }

      .brand-copy {
        text-align:center;
      }

      .logo {
        width:92px;
        height:92px;
      }

      .botanical {
        display:none;
      }
    }
  </style>
</head>

      <section class="hero">
        <h1>Qual empresa deseja abrir?</h1>

        <div class="ornament">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20V10"/>
            <path d="M12 14C8 14 5 11 5 7C9 7 12 10 12 14Z"/>

        <p>Selecione uma empresa para acessar o dashboard</p>
      </section>

      <section class="grid" id="companies"></section>

      <section class="quote">
        <div class="quote-leaf">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21V10"/>

      </section>

  <script>
    const ICONS = {
      factory: `
        <svg viewBox="0 0 24 24"><path d="M3 21V9l6 3V9l6 3V5h4v16Z"/><path d="M6 17h2M11 17h2M16 17h2"/></svg>`,
      building: `
        <svg viewBox="0 0 24 24"><path d="M5 21V7h7v14M12 21V3h7v18M3 21h18"/><path d="M8 10h1M8 13h1M8 16h1M15 7h1M15 10h1M15 13h1M15 16h1"/></svg>`,
      store: `
        <svg viewBox="0 0 24 24"><path d="M4 10v11h16V10"/><path d="M3 10l2-6h14l2 6"/><path d="M3 10c0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0 0 2 3 2 3 0"/><path d="M8 21v-6h8v6"/></svg>`,
      heart: `
        <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="M7 12h3l1.5-3 2 6 1.5-3h2"/></svg>`,
      calendar: `
        <svg viewBox="0 0 24 24"><path d="M5 3v3M19 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/></svg>`,
      users: `
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      arrow: `
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`
    };

    const empresas = [
  {
    nome: "Aladim Brindes",
    inicio: "01/07/2026",
    colaboradores: 25,
    icone: "factory",
    url: "https://script.google.com/macros/s/AKfycbyUwoVk6qh707IFuTfX-onF4Igt19G3D_j5DrAwL1AQ3Zj4OoVI6mVTGJHW0tePM0Iz/exec"
  },
  {
    nome: "Magma",
    inicio: "15/07/2026",
    colaboradores: 18,
    icone: "building",
    url: "https://script.google.com/macros/s/AKfycbzHeDcvltzfaxrn7lp6UFnpW0rSv5u3vMDrFOB5urU3C8SJPX1lTnZ1BCmENpFvqwl3Ww/exec"
  },
  {
    nome: "Desing Brilhos",
    inicio: "20/07/2026",
    colaboradores: 100,
    icone: "store",
    url: "https://script.google.com/macros/s/AKfycbxAsGZhHSfLawpgmUBmeY2P9WEoEY8lF6hB0IQQz9o-P7ES2O04QSL1UMEB5OxLVtABnw/exec"
  },
  {
    nome: "Empresa",
    inicio: "",
    colaboradores: 0,
    icone: "heart",
    url: ""
  }
];

    document.getElementById("companies").innerHTML = empresas.map(empresa => {
      const ativo = Boolean(empresa.url && empresa.url.trim());

      return `
        <article class="card">
          <div class="card-head">
            <div class="company-icon">${ICONS[empresa.icone]}</div>
            <div class="company-name">${empresa.nome}</div>
          </div>

          <div class="details">
            <div class="detail">
              <div class="detail-icon">${ICONS.calendar}</div>
              <div>
                <div class="label">Início do contrato</div>
                <div class="value">${empresa.inicio}</div>
              </div>
            </div>

            <div class="detail">
              <div class="detail-icon">${ICONS.users}</div>
              <div>
                <div class="label">Quantidade de colaboradores</div>
                <div class="value">${empresa.colaboradores} colaboradores</div>
              </div>
            </div>
          </div>

          <a class="open ${ativo ? "" : "disabled"}"
             href="${ativo ? empresa.url : "#"}"
             target="_blank"
             rel="noopener noreferrer">
            <span>${ativo ? "Abrir" : "Aguardando link"}</span>
            ${ICONS.arrow}
          </a>
        </article>
      `;
    }).join("");
  </script>
